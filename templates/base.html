<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}: {{ site_tagline }}{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}{{ seo.description if seo is defined else "Forming Boys. Forging Men. Building Legacies." }}{% endblock %}">
  <meta name="theme-color" content="#07182E">
  {% if seo is defined %}
  <link rel="canonical" href="{{ seo.canonical_url }}">
  <meta property="og:type" content="{{ seo.og_type }}">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical_url }}">
  <meta property="og:image" content="{{ seo.og_image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ seo.title }}">
  <meta name="twitter:description" content="{{ seo.description }}">
  <meta name="twitter:image" content="{{ seo.og_image }}">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/brand/logo.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/brand/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'components/navigation.html' %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include 'components/footer.html' %}
  <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
