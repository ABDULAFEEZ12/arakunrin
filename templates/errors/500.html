{% extends "base.html" %}
{% block title %}Something Went Wrong — {{ site_name }}{% endblock %}
{% block content %}
<section class="band text-center" style="min-height:70vh; display:flex; align-items:center; padding-top:8rem;">
  <div class="wrap">
    <span class="kicker kicker--center">500</span>
    <h1 data-reveal>Formation Takes Patience.</h1>
    <p class="lede mt-2" style="margin-inline:auto;" data-reveal>Something went wrong on our end. Please try again shortly.</p>
    <div class="cta__actions mt-3" data-reveal>
      <a href="{{ url_for('public.home') }}" class="btn btn--gold">Return Home <span class="btn__arrow">&rarr;</span></a>
    </div>
  </div>
</section>
{% endblock %}
