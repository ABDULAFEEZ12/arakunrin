{% extends "base.html" %}
{% block title %}Page Not Found | {{ site_name }}{% endblock %}
{% block content %}
<section class="band text-center" style="min-height:70vh; display:flex; align-items:center; padding-top:8rem;">
  <div class="wrap">
    <span class="kicker kicker--center">404</span>
    <h1 data-reveal>This Path Has Not Been Formed.</h1>
    <p class="lede mt-2" style="margin-inline:auto;" data-reveal>The page you're looking for doesn't exist. Return to the Institute.</p>
    <div class="cta__actions mt-3" data-reveal>
      <a href="{{ url_for('public.home') }}" class="btn btn--gold">Return Home <span class="btn__arrow">&rarr;</span></a>
      <a href="{{ url_for('public.contact') }}" class="btn btn--line">Contact Us</a>
    </div>
  </div>
</section>
{% endblock %}
