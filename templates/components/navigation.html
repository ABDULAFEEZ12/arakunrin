<!-- templates/components/navigation.html -->
<nav class="nav" role="navigation" aria-label="Main navigation">
  <div class="nav__row">
    <a href="{{ url_for('public.home') }}" class="nav__mark" aria-label="{{ site_name }} home">
      <svg viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M12 1.5 L22 5.5 V13 C22 19.5 17.5 24 12 26.5 C6.5 24 2 19.5 2 13 V5.5 Z" stroke-linejoin="round"/>
      </svg>
      <span>
        <span class="nav__word">{{ site_name }}</span>
        <span class="nav__sub">{{ site_tagline }}</span>
      </span>
    </a>

    <ul class="nav__links">
      {% for item in navigation.primary %}
      <li><a href="{{ url_for(item.endpoint) }}" class="nav__link {% if request.endpoint == item.endpoint %}is-active{% endif %}">{{ item.label }}</a></li>
      {% endfor %}
      <li><a href="{{ url_for(navigation.cta.endpoint) }}" class="nav__cta">{{ navigation.cta.label }}</a></li>
    </ul>

    <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
